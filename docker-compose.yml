services:
  db:
    image: postgres:16-alpine
    container_name: catraca-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catraca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catraca}
      POSTGRES_DB: ${POSTGRES_DB:-catraca}
    volumes:
      - catraca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catraca} -d ${POSTGRES_DB:-catraca}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: catraca-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-catraca}:${POSTGRES_PASSWORD:-catraca}@db:5432/${POSTGRES_DB:-catraca}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-2026}
      GATEWAY_DELAY_MODE: ${GATEWAY_DELAY_MODE:-default}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-catraca}:${POSTGRES_PASSWORD:-catraca}@db:5432/catraca_test
      ADMIN_DATABASE_URL: postgresql://${POSTGRES_USER:-catraca}:${POSTGRES_PASSWORD:-catraca}@db:5432/postgres
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-partner-key-2026}
      GATEWAY_DELAY_MODE: fast
    command: >
      sh -c "
        echo '==> [1/3] Backend typecheck' &&
        npm --prefix backend run typecheck &&
        echo '==> [2/3] Frontend typecheck and build' &&
        npm --prefix frontend run typecheck &&
        npm --prefix frontend run build &&
        echo '==> [3/3] Backend automated tests' &&
        npm --prefix backend test
      "

volumes:
  catraca_pgdata:
